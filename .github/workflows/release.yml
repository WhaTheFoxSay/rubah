name: Universal Cross-Platform Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build:
    name: Build ${{ matrix.binary_name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux 64-bit Static MUSL (Compatible with RHEL, CentOS, Ubuntu, Debian, Alpine, etc. - ZERO GLIBC Dependency)
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            binary_name: rubah-linux-amd64

          # macOS Apple Silicon
          - os: macos-latest
            target: aarch64-apple-darwin
            binary_name: rubah-macos-arm64

          # macOS Intel
          - os: macos-13
            target: x86_64-apple-darwin
            binary_name: rubah-macos-amd64

          # Windows
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary_name: rubah-windows-amd64.exe

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install MUSL Tools for Linux
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools musl-dev

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build Binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Prepare Artifact
        shell: bash
        run: |
          mkdir -p dist
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            cp target/${{ matrix.target }}/release/rubah.exe dist/${{ matrix.binary_name }}
          else
            cp target/${{ matrix.target }}/release/rubah dist/${{ matrix.binary_name }}
            strip dist/${{ matrix.binary_name }} || true
          fi

      - name: Release to GitHub
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ matrix.binary_name }}
          tag_name: ${{ github.ref_name }}
          name: Rubah Release ${{ github.ref_name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
