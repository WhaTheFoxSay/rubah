name: Build & Publish Release Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build Binary for ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary_name: rubah-linux-amd64
          - os: macos-latest
            target: aarch64-apple-darwin
            binary_name: rubah-macos-arm64
          - os: macos-13
            target: x86_64-apple-darwin
            binary_name: rubah-macos-amd64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary_name: rubah-windows-amd64.exe

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build Binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Rename Binary
        shell: bash
        run: |
          mkdir -p dist
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            cp target/${{ matrix.target }}/release/rubah.exe dist/${{ matrix.binary_name }}
          else
            cp target/${{ matrix.target }}/release/rubah dist/${{ matrix.binary_name }}
            strip dist/${{ matrix.binary_name }} || true
          fi

      - name: Upload Release Artifacts
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          files: dist/${{ matrix.binary_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
